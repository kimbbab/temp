<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>수능 수학 한 줄씩</title>
<meta name="description" content="2027학년도 수능 수학 46문항을 한 줄씩 쉽게 풀어 보고, 모르는 부분은 Claude에게 물어보는 학습 사이트">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e1dc;--accent:#2f5fd0;--accent-ink:#fff;--accent-soft:#e8eefc;--ok:#0f7a4a;--ok-soft:#e5f4ec;--bad:#b3261e;--bad-soft:#fbe9e7;--tip:#8a5a00;--tip-soft:#fbf2dc;--imgbg:#fff;--shadow:0 6px 24px rgba(0,0,0,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151517;--card:#1f1f22;--ink:#ececee;--sub:#9a9aa2;--line:#33333a;--accent:#7ea2ff;--accent-ink:#0e1222;--accent-soft:#232c45;--ok:#5fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;--tip:#e8bb5a;--tip-soft:#3a2f17;--imgbg:#f4f4f4;--shadow:0 6px 24px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#151517;--card:#1f1f22;--ink:#ececee;--sub:#9a9aa2;--line:#33333a;--accent:#7ea2ff;--accent-ink:#0e1222;--accent-soft:#232c45;--ok:#5fd39b;--ok-soft:#173226;--bad:#ff8a80;--bad-soft:#3a1d1b;--tip:#e8bb5a;--tip-soft:#3a2f17;--imgbg:#f4f4f4;--shadow:0 6px 24px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.7;font-size:16px}
button{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 120px}
header h1{font-size:21px;margin:6px 0 2px;letter-spacing:-.3px}
header p{margin:0;color:var(--sub);font-size:14px}
.tabs{display:flex;gap:6px;margin:16px 0 10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.dots button{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums;position:relative}
.dots button.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-soft)}
.dots button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dots button.ok.on{outline:2px solid var(--accent);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--sub)}
.qhead b{color:var(--ink);font-size:17px}
.qimg{background:var(--imgbg);padding:14px 12px;text-align:center}
.qimg img{max-width:100%;height:auto}
.sec{padding:16px 18px}
.sec+.sec{border-top:1px solid var(--line)}
.sec h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec h2 .n{font-size:12px;color:var(--sub);font-weight:400}
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choices button{min-width:52px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer}
.choices button:hover{border-color:var(--accent)}
.choices button.pick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.short{display:flex;gap:8px}
.short input{flex:1;min-width:0;max-width:200px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:18px;padding:0 12px}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px;display:none}
.fb.ok{display:block;background:var(--ok-soft);color:var(--ok)}
.fb.bad{display:block;background:var(--bad-soft);color:var(--bad)}
.concepts{margin:0;padding:0;list-style:none}
.concepts li{position:relative;padding:6px 0 6px 22px;font-size:15px}
.concepts li::before{content:"•";position:absolute;left:6px;color:var(--tip);font-weight:700}
.steps{list-style:none;margin:0;padding:0}
.step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);animation:in .35s ease}
.step:last-child{border-bottom:0}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.step .no{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.step .body{flex:1;min-width:0}
.step .t{font-size:16px;overflow-x:auto;overflow-y:hidden}
.step .h{font-size:14px;color:var(--tip);background:var(--tip-soft);border-radius:8px;padding:4px 10px;margin-top:6px;display:inline-block}
.step .ask{margin-top:6px;border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:2px 0}
.step .ask:hover{text-decoration:underline}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.progress{font-size:13px;color:var(--sub);margin-left:auto;align-self:center}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.note{font-size:12px;color:var(--sub);margin-top:22px;text-align:center}
.katex{font-size:1.06em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
/* chat */
.fab{position:fixed;right:16px;bottom:16px;z-index:20;height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;box-shadow:var(--shadow);cursor:pointer}
.chat{position:fixed;z-index:30;right:16px;bottom:16px;width:min(500px,calc(100vw - 32px));height:min(760px,calc(100vh - 32px));max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);min-width:300px;min-height:280px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:none;flex-direction:column;overflow:hidden}
.chat.open{display:flex}
.chat header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
.chat header .tools{display:flex;align-items:center}
.chat.max{left:16px!important;top:16px;width:auto!important;height:auto!important;max-width:none;max-height:none}
.grip{position:absolute;left:0;top:0;width:22px;height:22px;cursor:nwse-resize;z-index:2;touch-action:none}
.grip::before{content:"";position:absolute;left:5px;top:5px;width:9px;height:9px;border-left:2px solid var(--sub);border-top:2px solid var(--sub);border-radius:2px 0 0 0;opacity:.9}
.grip:hover::before{border-color:var(--accent)}
.bar{display:none}
.chat.resizing{user-select:none;transition:none}
.chat header b{font-size:15px}
#chatSub{font-size:12px;color:var(--sub);display:block}
.chat header button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--sub);line-height:1;padding:4px 8px}
.log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:90%;padding:10px 13px;border-radius:12px;font-size:16px;line-height:1.65;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a .katex-display{margin:.4em 0}
.msg.err{align-self:center;background:var(--bad-soft);color:var(--bad);font-size:13px}
.msg.a.wait::after{content:"…";animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer;text-align:left}
.chips button:hover{border-color:var(--accent)}
.inp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.inp textarea{flex:1;min-width:0;resize:none;height:46px;max-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px;padding:10px 12px}
.inp .btn{height:46px}
.hello{font-size:14px;color:var(--sub);background:var(--bg);border-radius:12px;padding:10px 12px}
@media (max-width:640px){
  .chat{right:0;left:0;bottom:0;width:auto;height:82vh;height:82dvh;min-width:0;max-width:none;max-height:100dvh;border-radius:16px 16px 0 0}
  .chat.max{left:0!important;top:0;border-radius:0}
  .grip{display:none}
  .bar{display:block;position:absolute;left:0;right:0;top:0;height:18px;cursor:ns-resize;touch-action:none}
  .bar::before{content:"";position:absolute;left:50%;top:6px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:var(--line)}
  .chat header{padding-top:18px}
  .wrap{padding:12px 16px 110px}
  .sec{padding:14px 14px}
}
</style></head>
<body>
<div class="wrap">
  <header>
    <h1>수능 수학, 한 줄씩 천천히</h1>
    <p>2027학년도 수능 수학 46문항 · 직접 풀어 보고, 풀이를 한 줄씩 펼치고, 모르면 Claude에게 물어보세요.</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="dots" id="dots"></div>
  <div id="main"></div>
  <div class="nav"><button class="btn" id="prev">← 이전 문제</button><button class="btn" id="next">다음 문제 →</button></div>
  <p class="note">문제 출처: 한국교육과정평가원 2027학년도 대학수학능력시험 수학 영역 · 풀이와 해설은 학습용으로 작성했습니다.<br>Claude 질문은 한 사람당 1분 6회, 하루 40회까지 가능합니다.</p>
</div>

<button class="fab" id="fab">💬 Claude에게 질문</button>
<section class="chat" id="chat" aria-label="Claude에게 질문">
  <header><span class="grip" id="grip" title="끌어서 크기 조절"></span><span class="bar" id="bar" title="끌어서 높이 조절"></span><div><b>Claude 선생님</b><span id="chatSub"></span></div><div class="tools"><button id="max" title="크게 보기" aria-label="크게 보기">⤢</button><button id="close" aria-label="닫기">×</button></div></header>
  <div class="log" id="log"></div>
  <div class="chips" id="chips"></div>
  <form class="inp" id="form"><textarea id="q" maxlength="600" placeholder="모르는 걸 편하게 물어보세요"></textarea><button class="btn pri" id="send">보내기</button></form>
</section>

<script>
const SUBJ=[['common','공통 (1~22)'],['prob','확률과 통계'],['calc','미적분'],['geo','기하']];
let DATA=[],subj='common',idx=0,shown={},busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let solved=store.get('st27-solved',{}),chats=store.get('st27-chats',{});
const math=el=>{if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false})};
const list=()=>DATA.filter(d=>d.subj===subj).sort((a,b)=>a.n-b.n);
const cur=()=>list()[idx];
const sname=s=>SUBJ.find(x=>x[0]===s)[1].replace(/ \(.*\)/,'');

function render(){
  const L=list(),d=L[idx];
  $('#tabs').innerHTML=SUBJ.map(([k,l])=>`<button class="${k===subj?'on':''}" data-s="${k}">${l}</button>`).join('');
  $('#dots').innerHTML=L.map((x,i)=>`<button class="${i===idx?'on':''} ${solved[x.id]?'ok':''}" data-i="${i}" aria-label="${x.n}번">${x.n}</button>`).join('');
  const n=shown[d.id]||1;
  const ansUI=d.mc
    ?`<div class="choices">${['①','②','③','④','⑤'].map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div>`
    :`<form class="short" id="sf"><input id="sa" inputmode="numeric" autocomplete="off" placeholder="답 (숫자)"><button class="btn pri">확인</button></form>`;
  $('#main').innerHTML=`<div class="card">
    <div class="qhead"><span><b>${d.n}번</b> · ${sname(d.subj)}</span><span>${d.pts}점 · ${d.mc?'5지선다':'단답형'}${solved[d.id]?' · ✓ 맞힘':''}</span></div>
    <div class="qimg"><img src="${d.img}" alt="${d.n}번 문제: ${esc(d.q)}"></div>
    <div class="sec"><h2>✏️ 먼저 직접 풀어 보기</h2>${ansUI}<div class="fb" id="fb"></div></div>
    <div class="sec"><h2>📌 알아 두면 좋은 것</h2><ul class="concepts">${d.concepts.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>
    <div class="sec"><h2>🪜 한 줄씩 풀이 <span class="n">핵심: ${esc(d.key)}</span></h2>
      <ol class="steps" id="steps"></ol>
      <div class="ctrl"><button class="btn pri" id="more">다음 줄 보기 ▼</button><button class="btn" id="all">전부 펼치기</button><button class="btn" id="reset">처음부터</button><span class="progress" id="prog"></span></div>
    </div></div>`;
  drawSteps(n,false);
  math($('#main'));
  $('#prev').disabled=idx===0&&subj==='common';
  $('#next').disabled=idx===L.length-1&&subj==='geo';
  $('#chatSub').textContent=`${sname(d.subj)} ${d.n}번에 대해 질문 중`;
  drawChat();
  store.set('st27-pos',{subj,idx});
}
function stepHTML(s,i){return `<li class="step"><div class="no">${i+1}</div><div class="body"><div class="t">${esc(s.t)}</div>${s.h?`<div class="h">💡 ${esc(s.h)}</div>`:''}<br><button class="ask" data-ask="${i}">이 줄이 이해 안 돼요 →</button></div></li>`}
function drawSteps(n,anim=true){
  const d=cur(),ol=$('#steps');n=Math.min(n,d.steps.length);shown[d.id]=n;
  const have=ol.children.length;
  if(n<have||!anim){ol.innerHTML=d.steps.slice(0,n).map(stepHTML).join('');math(ol);if(!anim)ol.querySelectorAll('.step').forEach(e=>e.style.animation='none')}
  else for(let i=have;i<n;i++){ol.insertAdjacentHTML('beforeend',stepHTML(d.steps[i],i));math(ol.lastElementChild)}
  $('#prog').textContent=`${n} / ${d.steps.length}줄`;
  $('#more').disabled=$('#all').disabled=n>=d.steps.length;
  $('#more').textContent=n>=d.steps.length?'풀이 끝 ✓':'다음 줄 보기 ▼';
}
function check(v){
  const d=cur(),fb=$('#fb');
  const norm=x=>String(x).trim().replace(/\s/g,'');
  const ok=norm(v)===norm(d.ans)||(!d.mc&&Number(norm(v))===Number(d.ans));
  if(ok){fb.className='fb ok';fb.innerHTML=`🎉 정답이에요! (${esc(d.ans)}) 풀이를 끝까지 보며 과정을 확인해 보세요.`;solved[d.id]=1;store.set('st27-solved',solved);
    $('#dots').querySelector(`[data-i="${idx}"]`).classList.add('ok')}
  else{fb.className='fb bad';fb.innerHTML=`아쉬워요, ${esc(v)}은(는) 아니에요. 풀이를 한 줄씩 보며 힌트를 얻거나, Claude에게 “내 답은 ${esc(v)}인데 어디가 틀렸을까요?”라고 물어보세요.`;fb.dataset.wrong=v}
}
function go(dl){
  const order=SUBJ.map(s=>s[0]);idx+=dl;
  if(idx<0){const si=order.indexOf(subj);if(si>0){subj=order[si-1];idx=list().length-1}else idx=0}
  else if(idx>=list().length){const si=order.indexOf(subj);if(si<order.length-1){subj=order[si+1];idx=0}else idx=list().length-1}
  render();window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- chat ---------- */
function fmt(t){ // escape, keep $math$, light markdown
  let h=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return h.split(/\n{2,}/).map(p=>`<p style="margin:.35em 0">${p.replace(/\n/g,'<br>')}</p>`).join('');
}
function drawChat(){
  const d=cur(),h=chats[d.id]||[],log=$('#log');
  log.innerHTML=`<div class="hello">${d.n}번 문제와 풀이를 Claude가 함께 보고 있어요. 어떤 줄이 왜 그렇게 되는지, 용어 뜻, 내가 푼 방법이 맞는지 무엇이든 물어보세요.</div>`+
    h.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):fmt(m.content)}</div>`).join('');
  math(log);log.scrollTop=log.scrollHeight;
  const wrong=$('#fb')&&$('#fb').dataset.wrong;
  const chips=['이 문제가 무엇을 묻는 건지 쉽게 설명해 주세요','정답 말고 첫 힌트만 주세요','이 문제에 필요한 개념을 처음부터 알려 주세요'];
  if(wrong)chips.unshift(`제 답은 ${wrong}인데 어디서 틀렸을까요?`);
  $('#chips').innerHTML=h.length>4?'':chips.map(c=>`<button data-q="${esc(c)}">${esc(c)}</button>`).join('');
}
function openChat(prefill){$('#chat').classList.add('open');$('#fab').style.display='none';drawChat();if(prefill!=null){$('#q').value=prefill}$('#q').focus()}
function closeChat(){$('#chat').classList.remove('open');$('#fab').style.display=''}
async function ask(text){
  text=text.trim();if(!text||busy)return;
  const d=cur(),id=d.id;chats[id]=chats[id]||[];
  chats[id].push({role:'user',content:text});$('#q').value='';drawChat();
  const log=$('#log'),el=document.createElement('div');el.className='msg a wait';log.appendChild(el);log.scrollTop=log.scrollHeight;
  busy=true;$('#send').disabled=true;let out='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,messages:chats[id].slice(-10)})});
    if(!r.ok){let e='문제가 생겼어요.';try{e=(await r.json()).error||e}catch(_){}throw new Error(e)}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+2);if(!line.startsWith('data: '))continue;
        const o=JSON.parse(line.slice(6));if(o.error)throw new Error(o.error);if(o.t){out+=o.t;el.classList.remove('wait');el.innerHTML=fmt(out);log.scrollTop=log.scrollHeight}}}
    if(!out)throw new Error('답변이 비어 있어요. 다시 시도해 주세요.');
    chats[id].push({role:'assistant',content:out});
  }catch(e){
    if(out)chats[id].push({role:'assistant',content:out});else chats[id].pop();
    el.remove();const er=document.createElement('div');er.className='msg err';er.textContent=e.message;
    if(cur().id===id){drawChat();$('#log').appendChild(er);if(!out)$('#q').value=text}
  }finally{busy=false;$('#send').disabled=false}
  for(const k in chats)chats[k]=chats[k].slice(-20);store.set('st27-chats',chats);
  if(cur().id===id)drawChat();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.s){subj=t.dataset.s;idx=0;render()}
  else if(t.dataset.i){idx=+t.dataset.i;render()}
  else if(t.dataset.c){document.querySelectorAll('.choices button').forEach(b=>b.classList.toggle('pick',b===t));check(t.dataset.c)}
  else if(t.dataset.ask!=null){const d=cur(),i=+t.dataset.ask;openChat(`${i+1}번째 줄 「${d.steps[i].t}」 이 부분이 이해가 안 돼요. 더 쉽게 설명해 주세요.`)}
  else if(t.dataset.q){ask(t.dataset.q)}
  else if(t.id==='more')drawSteps((shown[cur().id]||1)+1);
  else if(t.id==='all')drawSteps(99);
  else if(t.id==='reset')drawSteps(1,false);
  else if(t.id==='prev')go(-1);else if(t.id==='next')go(1);
  else if(t.id==='fab')openChat();else if(t.id==='close')closeChat();
  else if(t.id==='max'){const c=$('#chat');c.classList.toggle('max');t.textContent=c.classList.contains('max')?'⤡':'⤢';store.set('st27-chatmax',c.classList.contains('max'))}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='sf'){const v=$('#sa').value;if(v.trim())check(v)}else if(e.target.id==='form')ask($('#q').value)});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask($('#q').value)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeChat()});

/* 챗봇 창 크기 조절: 데스크톱은 왼쪽 위 모서리, 휴대폰은 위쪽 막대를 끌기 */
(function(){
  const c=$('#chat'),sz=store.get('st27-chatsize',null),mob=()=>innerWidth<=640;
  const apply=s=>{if(!s)return;if(mob()){if(s.mh)c.style.height=s.mh+'px'}else{if(s.w)c.style.width=s.w+'px';if(s.h)c.style.height=s.h+'px'}};
  apply(sz);if(store.get('st27-chatmax',false)){c.classList.add('max');$('#max').textContent='⤡'}
  function drag(e,mode){
    e.preventDefault();c.classList.remove('max');$('#max').textContent='⤢';c.classList.add('resizing');
    const r=c.getBoundingClientRect(),x0=e.clientX,y0=e.clientY;
    const mv=ev=>{const dy=y0-ev.clientY,dx=x0-ev.clientX;
      if(mode==='bar'){c.style.height=Math.max(240,Math.min(innerHeight,r.height+dy))+'px'}
      else{c.style.width=Math.max(300,Math.min(innerWidth-32,r.width+dx))+'px';c.style.height=Math.max(280,Math.min(innerHeight-32,r.height+dy))+'px'}};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);c.classList.remove('resizing');
      const b=c.getBoundingClientRect(),s=store.get('st27-chatsize',{})||{};if(mode==='bar')s.mh=Math.round(b.height);else{s.w=Math.round(b.width);s.h=Math.round(b.height)}store.set('st27-chatsize',s)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);
  }
  $('#grip').addEventListener('pointerdown',e=>drag(e,'grip'));
  $('#bar').addEventListener('pointerdown',e=>drag(e,'bar'));
})();
fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;const p=store.get('st27-pos',null);if(p&&SUBJ.some(s=>s[0]===p.subj)){subj=p.subj;idx=Math.min(p.idx,list().length-1)}
  if(window.katex)render();else window.addEventListener('load',render)});
</script>
</body></html>
